<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WebRTC Direct Test</title>
<style>
body{font:16px -apple-system,BlinkMacSystemFont,sans-serif;max-width:850px;margin:20px auto;padding:0 14px;background:#15171b;color:#eee}
button{padding:12px;margin:4px 2px;font-size:15px}textarea{box-sizing:border-box;width:100%;min-height:130px;margin:8px 0;background:#22262c;color:#eee;border:1px solid #555;padding:8px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#22262c;padding:10px}#status{padding:12px;background:#242a31;overflow-wrap:anywhere}
</style>
</head>
<body>
<h2>WebRTC — проверка прямого соединения</h2>
<p>Страница размещена на GitHub Pages. Музыка или другие файлы через GitHub не передаются: тестируем только прямой WebRTC DataChannel с STUN.</p>
<div id="status">Страница загружена</div>
<p><b>1. Обмен данными</b></p>
<textarea id="out" placeholder="Исходящие данные появятся здесь"></textarea>
<button id="offer">Создать OFFER (Mac)</button>
<button id="answer">Создать ANSWER (iPhone)</button>
<textarea id="in" placeholder="Вставьте сюда данные второго устройства"></textarea>
<button id="apply">Применить ANSWER (Mac)</button>
<p><b>2. Состояние соединения</b></p><pre id="diag">Соединение ещё не создано</pre>
<p><b>3. Проверка передачи</b></p>
<button id="send">Отправить TEST</button><pre id="log"></pre>
<script>
const $=id=>document.getElementById(id);let pc=null,dc=null;
function log(s){$('log').textContent+=s+'\n';}
function update(s){
 $('status').textContent=s;
 if(!pc){$('diag').textContent='Соединение ещё не создано';return;}
 $('diag').textContent='ICE: '+pc.iceConnectionState+'\nConnection: '+pc.connectionState+'\nGathering: '+pc.iceGatheringState+'\nSignaling: '+pc.signalingState+'\n\nЛокальные кандидаты:\n'+(pc.localDescription?.sdp?.split('\n').filter(x=>x.includes('a=candidate:')).join('\n')||'нет')+'\n\nУдалённые кандидаты:\n'+(pc.remoteDescription?.sdp?.split('\n').filter(x=>x.includes('a=candidate:')).join('\n')||'нет');
}
function newPC(){
 pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});
 pc.oniceconnectionstatechange=()=>update('ICE: '+pc.iceConnectionState);
 pc.onconnectionstatechange=()=>update('Соединение: '+pc.connectionState);
 pc.onicecandidate=()=>update('Обновлены сетевые кандидаты');
 pc.ondatachannel=e=>{dc=e.channel;wire();};return pc;
}
function wire(){dc.onopen=()=>{update('КАНАЛ ОТКРЫТ');log('Канал открыт');};dc.onmessage=e=>log('ПОЛУЧЕНО: '+e.data);dc.onclose=()=>log('Канал закрыт');}
function waitGathering(){if(pc.iceGatheringState==='complete')return Promise.resolve();return new Promise(resolve=>{const done=()=>{if(pc.iceGatheringState==='complete'){pc.removeEventListener('icegatheringstatechange',done);resolve();}};pc.addEventListener('icegatheringstatechange',done);setTimeout(resolve,20000);});}
$('offer').onclick=async()=>{try{newPC();dc=pc.createDataChannel('direct-test');wire();await pc.setLocalDescription(await pc.createOffer());update('Собираем кандидаты OFFER…');await waitGathering();$('out').value=JSON.stringify(pc.localDescription);update('OFFER готов. Перенесите его на iPhone.');}catch(e){update('Ошибка: '+e);}};
$('answer').onclick=async()=>{try{newPC();await pc.setRemoteDescription(JSON.parse($('in').value));await pc.setLocalDescription(await pc.createAnswer());update('Собираем кандидаты ANSWER…');await waitGathering();$('out').value=JSON.stringify(pc.localDescription);update('ANSWER готов. Перенесите его на Mac.');}catch(e){update('Ошибка: '+e);}};
$('apply').onclick=async()=>{try{if(!pc)throw Error('Сначала создайте OFFER на Mac');await pc.setRemoteDescription(JSON.parse($('in').value));update('ANSWER применён; ожидаем соединение…');}catch(e){update('Ошибка: '+e);}};
$('send').onclick=()=>{if(dc&&dc.readyState==='open')dc.send('TEST FROM '+(/iPhone|iPad/.test(navigator.userAgent)?'IPHONE':'MAC'));else log('Канал не открыт');};
if(!window.RTCPeerConnection)update('Ошибка: WebRTC не поддерживается');
</script>
</body></html>
